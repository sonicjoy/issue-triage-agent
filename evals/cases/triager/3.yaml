  title: Provider-switchable LLM config
  body: |-
    One setting chooses Anthropic or OpenAI for every agent and the judge, so runs, evals and costs can be compared across providers.

    **Done when**
    - `AFR_LLM_MODEL` (e.g. `anthropic:claude-sonnet-5-5`) and `AFR_LLM_CHEAP_MODEL` (e.g. `anthropic:claude-haiku-5-5`) accept either provider via LangChain `init_chat_model`
    - `pricing.yaml` holds per-model token prices used for cost calculation
    - A smoke test calls each provider with the same prompt and is skipped when that provider's key is missing

    Estimate: ~0.5h

