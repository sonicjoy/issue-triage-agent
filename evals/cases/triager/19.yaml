input:
  id: '19'
  title: Run evals in CI
  body: |-
    **Done when**
    - PRs run a fast smoke suite on the Gemini free tier, with the key stored as a GitHub Actions secret (`GOOGLE_API_KEY`); no Anthropic key in CI
    - The build fails below a pass-rate threshold or on any red-team failure
    - The smoke suite fits within Gemini free-tier rate limits; the full suite runs locally or on manual trigger
    - PRs from forks (no secrets) skip the LLM suite instead of failing

    Estimate: ~1h

    Plan: https://github.com/sonicjoy/agent-flight-recorder/blob/main/docs/PLAN.md
