name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # agent-flight-recorder is private until launch, so fetching it needs a read token:
      # a fine-grained PAT with Contents: read on that repo only, saved as RECORDER_READ_TOKEN.
      # Remove this step once the recorder is public.
      - name: Allow access to agent-flight-recorder
        env:
          TOKEN: ${{ secrets.RECORDER_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RECORDER_READ_TOKEN is not set; see the comment in ci.yml"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/sonicjoy/agent-flight-recorder".insteadOf "https://github.com/sonicjoy/agent-flight-recorder"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits to choose what to scan
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
