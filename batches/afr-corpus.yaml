# The run corpus for Agent Flight Recorder's error analysis (agent-flight-recorder #13).
#
#   uv run triager batch batches/afr-corpus.yaml --record http://127.0.0.1:4318
#
# About 200 runs: every real issue twice on the main model and once on Gemini's free tier,
# every synthetic case once on the cheap model (smaller models fail more), and 30 runs with
# tool failures injected. Stops at the spend cap; run it again to carry on.
#
# OpenAI rather than Anthropic for the paid runs: no Anthropic credit was available. The
# Gemini group ran first and is unchanged, so its runs stay done in the manifest.

budget_usd: 10

groups:
  - name: real-mini
    cases: real
    model: openai:gpt-5.4-mini
    comment_model: openai:gpt-5.4-nano
    repeats: 2

  - name: synthetic-nano
    cases: synthetic
    model: openai:gpt-5.4-nano

  - name: injected-mini
    cases: real
    sample: 30
    model: openai:gpt-5.4-mini
    comment_model: openai:gpt-5.4-nano
    inject: [timeout, bad-data, empty, noise]
    rate: 0.3

  # Free tier: one run every 30 s keeps a run's 3-6 calls well under its per-minute limit;
  # rate-limited calls back off and retry.
  - name: real-gemini
    cases: real
    model: google_genai:gemini-3.5-flash-lite
    pause_seconds: 30
